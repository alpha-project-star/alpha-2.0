<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#04060f">
    <title>Alpha — Offline</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #04060f; color: #f4f6ff; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 32rem; text-align: center; }
      h1 { letter-spacing: .12em; }
      p { color: #b9c1d8; line-height: 1.6; }
      button { border: 0; border-radius: 999px; padding: .8rem 1.2rem; background: #8b7cff; color: #090817; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>ALPHA</h1>
      <h2>You're offline</h2>
      <p>The app shell is available, but this page needs an internet connection to load fresh data and AI services.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
